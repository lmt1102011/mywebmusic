<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bông hoa đẹp nhất</title>
  <link rel="stylesheet" href="styles-song.css" />
</head>
<body>
  <div>
    <a href="index.html" class="back-button">back</a>
  </div>
  <div class="lyrics-box">
    <div class="image">
      <img id="cdImage" src="https://photo-resize-zmp3.zadn.vn/w600_r1x1_jpeg/cover/7/8/0/f/780f82ea6758f9b9ae2b6df1536e8cbb.jpg" alt="Ảnh bìa bài hát">
    </div>
    <h1>Bông hoa đẹp nhất</h1>
    <div class="marquee-container" id="lyricsDisplay"></div>
    <button class="play-button" onclick="togglePlayPause()">
      <img id="play-icon" src="play.png" alt="Play">
    </button>
    <audio id="player" src="BongHoaDepNhat-QuanAP-16059329.mp3"></audio>
  </div>

<script>
  let animationId = null;
  const audio = document.getElementById("player");
  const icon = document.getElementById("play-icon");
  const lyricsDisplay = document.getElementById("lyricsDisplay");
  const cdImage = document.getElementById("cdImage");

  const rawLyrics = `
  [00:19.14] Mãi sau này anh mới biết
[00:22.66] Bông hoa đó không phải của anh
[00:26.97] Chẳng qua là anh đã đi ngang qua đúng mùa hoa đẹp nhất
[00:35.90] Con tim anh cứ ngỡ là duyên số
[00:40.08] Thì ra đó là chỉ là chuyện hư vô
[00:44.22] Lý do chia tay là gì em có biết không?
[00:51.22] Vì em không yêu anh như anh yêu em
[00:55.08] Vì em xem anh chỉ là nhất thời
[01:00.68] Người mới chơi vơi như anh, làm sao anh mơ có em
[01:08.50] Mãi sau này xa nhau anh mới thấu
[01:12.40] Suốt chặng đường khi yêu ai biết đâu
[01:16.77] Người mình từng thương giờ như hai người xa lạ đã biết hết về nhau
[01:24.03] Sau này gặp nhau anh muốn biết
[01:27.76] Mùa hoa đẹp nhất em có nhớ gì
[01:33.03] Ngày đó yêu nhau lúc xuân thì
[01:36.95] Mà điều gì làm em quay lưng đi
[01:41.15] Nếu gặp lại nhau em vẫn ôm anh
[01:45.48] Hay em sẽ né tránh anh
[01:49.47] Chỉ dám buông đôi câu chào
[01:52.86] Dạo này anh sao?
[01:57.96] 
[02:13.07] Mãi sau này anh mới biết
[02:16.86] Người đó không phải người yêu anh
[02:20.92] Chẳng qua là anh đã đi ngang qua đúng ngày người cô đơn nhất
[02:29.31] Thì thầm vài câu mình nói yêu nhau
[02:33.46] Thế nên chuyện mình cũng chẳng tới đâu
[02:38.15] Lý do chia tay là gì em có biết không?
[02:45.08] Vì em không yêu anh như anh yêu em
[02:49.15] Vì em xem anh chỉ là nhất thời
[02:54.49] Người mới chơi vơi như anh, làm sao anh mơ có em
[03:02.42] Mãi sau này xa nhau anh mới thấu
[03:06.48] Suốt chặng đường khi yêu ai biết đâu
[03:10.63] Người mình từng thương giờ như hai người xa lạ đã biết hết về nhau
[03:18.18] Sau này gặp nhau anh muốn biết
[03:21.75] Mùa hoa đẹp nhất em có nhớ gì
[03:26.93] Ngày đó yêu nhau lúc xuân thì
[03:30.87] Mà điều gì làm em quay lưng đi
[03:35.07] Nếu gặp lại nhau em vẫn ôm anh
[03:39.35] Hay em sẽ né tránh anh
[03:43.26] Chỉ dám buông đôi câu chào
[03:46.56] Dạo này anh sao?
[03:50.05] Vì em không yêu anh như anh yêu em
[03:54.26] Vì em xem anh chỉ là nhất thời
[03:59.52] Người mới chơi vơi như anh, làm sao anh mơ có em
[04:07.39] Mãi sau này xa nhau anh mới thấu
[04:11.43] Suốt chặng đường khi yêu ai biết đâu
[04:15.85] Người mình từng thương giờ như hai người xa lạ đã biết hết về nhau
[04:22.84] Và sau này gặp nhau anh muốn biết
[04:26.78] Mùa hoa đẹp nhất em có nhớ gì
[04:32.03] Ngày đó yêu nhau lúc xuân thì
[04:35.82] Mà điều gì làm em quay đi
[04:40.05] Nếu gặp lại nhau em vẫn ôm anh
[04:44.30] Hay em sẽ né tránh anh
[04:48.38] Chỉ dám buông đôi câu chào
[04:51.67] Dạo này anh sao?
[04:55.22]  `;

  const lyrics = rawLyrics
    .trim()
    .split('\n')
    .filter(line => line.match(/^\[\d{2}:\d{2}\.\d{2}\]/))
    .map(line => {
      const match = line.match(/^\[(\d{2}):(\d{2})\.(\d{2})\]\s*(.*)/);
      if (!match) return null;
      const minutes = parseInt(match[1]);
      const seconds = parseInt(match[2]);
      const centiseconds = parseInt(match[3]);
      const text = match[4];
      const time = +(minutes * 60 + seconds + centiseconds / 100).toFixed(2);
      return { time, line: text };
    })
    .filter(Boolean);

  let currentLine = -1;
  let isPlaying = false;

  function showLyric(index) {
    lyricsDisplay.innerHTML = "";
    const lineDiv = document.createElement("div");
    lineDiv.className = "marquee-text";
    lineDiv.textContent = lyrics[index].line;

  let currentLine = -1;
  let isPlaying = false;}

  function showLyric(index) {
    lyricsDisplay.innerHTML = "";
    const lineDiv = document.createElement("div");
    lineDiv.className = "marquee-text";
    lineDiv.textContent = lyrics[index].line;

    let duration = 8;
    if (index < lyrics.length - 1) {
      duration = lyrics[index + 1].time - lyrics[index].time;
    }

    lineDiv.style.animation = `scrollText ${duration}s linear forwards`;
    lyricsDisplay.appendChild(lineDiv);
  }

  function syncLyrics() {
    const currentTime = audio.currentTime;

    if (currentLine === -1 && currentTime >= lyrics[0].time) {
      currentLine = 0;
      showLyric(currentLine);
    } else if (
      currentLine < lyrics.length - 1 &&
      currentTime >= lyrics[currentLine + 1].time
    ) {
      currentLine++;
      showLyric(currentLine);
    }

    if (isPlaying) {
      animationId = requestAnimationFrame(syncLyrics);
    }
  }

  function togglePlayPause() {
    if (audio.paused) {
      audio.play();
      icon.src = "pause.png";
      icon.alt = "Pause";
      cdImage.style.animationPlayState = "running";
      currentLine = -1;
      isPlaying = true;
      animationId = requestAnimationFrame(syncLyrics);
    } else {
      audio.pause();
      icon.src = "play.png";
      icon.alt = "Play";
      cdImage.style.animationPlayState = "paused";
      lyricsDisplay.innerHTML = "";
      currentLine = -1;
      isPlaying = false;
      if (animationId) cancelAnimationFrame(animationId);
      animationId = null;
    }
  }

  audio.addEventListener("ended", () => {
    if (animationId) cancelAnimationFrame(animationId);
    animationId = null;
    icon.src = "play.png";
    icon.alt = "Play";
    cdImage.style.animationPlayState = "paused";
    lyricsDisplay.innerHTML = "";
    audio.currentTime = 0;
    currentLine = -1;
    isPlaying = false;
  });
</script>
</body>
</html>
